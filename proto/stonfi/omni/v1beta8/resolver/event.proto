syntax = "proto3";

package stonfi.omni.v1beta8;

import "stonfi/common/v1/types/asset_id.proto";
import "stonfi/common/v1/types/chain_address.proto";
import "stonfi/omni/v1beta8/types/common.proto";
import "stonfi/omni/v1beta8/types/order.proto";
import "stonfi/omni/v1beta8/types/quote.proto";

////////////////////////////////////////////////////////////////////
// Data structures
////////////////////////////////////////////////////////////////////

message ProtocolParams {

  // The amount of protocol fees specific to corresponding method in percentage
  // in points (1/1,000,000 or 0.0001%). The protocol fees are always collected
  // in **Output asset**.
  uint32 protocol_fee_pips = 1;

  // (HTLC-Only) Asset used as the security deposit on the **Source**
  // blockchain. The resolver provides the deposit to guarantee timely
  // settlement.
  //
  // This parameter is omitted for intrachain swaps
  optional stonfi.common.v1.AssetId src_security_deposit_asset = 10;

  // (HTLC-Only) Volume of the security deposit  on the **Source** blockchain in
  // units of `src_security_deposit_asset`.
  //
  // This parameter is omitted for intrachain swaps
  optional string src_security_deposit_units = 11;

  // (HTLC-Only) Asset used as the security deposit on the **Destination**
  // blockchain. The resolver provides the deposit to guarantee timely
  // settlement.
  //
  // This parameter is omitted for intrachain swaps
  optional stonfi.common.v1.AssetId dst_security_deposit_asset = 12;

  // (HTLC-Only) Volume of the security deposit  on the **Destination**
  // blockchain in units of `dst_security_deposit_asset`.
  //
  // This parameter is omitted for intrachain swaps
  optional string dst_security_deposit_units = 13;

  // Maximum duration since quote generation before the trader must make a valid
  // deposit.
  sint64 quote_validity_timeout = 20;

  // Maximum duration since the trader creates the position before the resolver
  // must reserve it.
  //
  // At the end of this timeout, exclusivity ends. The trader's position may
  // become available for withdrawal, and Dutch auction may start if specified
  // by the escrow condition.
  sint64 exclusivity_timeout = 21;
}

////////////////////////////////////////////////////////////////////
// Resolver events
////////////////////////////////////////////////////////////////////

// Notifies the resolver that the connection is established.
//
// If the resolver doesn't receive `ConnectedEvent` over reasonable period of
// time after sending `ConnectRequest` (10-30s), it should attempt reconnection.
message ConnectedEvent {}

// Notifies the resolver that the quote has been requested by the trader.
message QuoteRequestedEvent {
  // ID of RFQ generated by the server (SHA-256 hex string).
  string rfq_id = 1;

  // The RFQ received from the trader forwarded as is.
  QuoteRequest quote_request = 2;

  // The timestamp (UTC seconds) of RFQ sent by the trader.
  sint64 request_timestamp = 3;

  // Either the amount of **Input asset** or **Output asset**.
  oneof resolver_amount {

    // The amount of **Input asset** that the resolver will receive after all
    // fees.
    //
    // For RFQs specifying `input_units` this amount is identical to RFQ,
    // otherwise it's empty.
    string resolver_receives_units = 10;

    // The amount of **Output asset** that the resolver should send including
    // all fees.
    //
    // For RFQs specifying `output_units` this amount is calculated by
    // increasing RFQ's amount by protocol & integrator fees, otherwise it's
    // empty.
    string resolver_sends_units = 11;
  }

  // The parameters of the Omniston protocol.
  ProtocolParams protocol_params = 20;
}

// Notifies the resolver that the RFQ has been cancelled by the trader.
message QuoteRequestCancelledEvent {
  // ID of RFQ from prior `QuoteRequestedEvent` (SHA-256 hex string)
  string rfq_id = 1;
}

// Notifies the resolver that the server accepted the quote sent in
// `UpdateQuoteRequest`.
//
// The resolver can match `UpdateQuoteRequest` & `QuoteAcceptedEvent` using
// `seqno` field.
message QuoteAcceptedEvent {
  // ID of RFQ from prior `QuoteRequestedEvent` (SHA-256 hex string)
  string rfq_id = 1;
  // ID of quote generated by the server (SHA-256 hex string)
  string quote_id = 2;
}

// Notifies the resolver that the server has rejected the quote sent in
// `UpdateQuoteRequest`.
//
// The resolver can match `UpdateQuoteRequest` & `QuoteRejectedEvent` using
// `seqno` field.
message QuoteRejectedEvent {

  // ID of RFQ from prior `QuoteRequestedEvent` (SHA-256 hex string)
  string rfq_id = 1;

  // Machine-readable reason why the submitted quote was rejected.
  //
  // Clients should primarily branch on this field. The exact human-readable
  // text in `message` is not stable enough for program logic.
  QuoteRejectedCode code = 2;

  // Human-readable explanation of the rejection.
  //
  // This field is intended for logs and debugging.
  string message = 3;
}

// Machine-readable quote rejection codes returned to resolvers.
enum QuoteRejectedCode {

  // Uncategorized error
  QUOTE_REJECTED_CODE_UNDEFINED = 0;

  // Invalid value of a parameter (ex: invalid address, invalid RFQ id, etc).
  QUOTE_REJECTED_CODE_INVALID_PARAMETERS = 1;

  // Asset amount restrictions don't pass RFQ requirements
  QUOTE_REJECTED_CODE_INVALID_AMOUNTS = 2;

  // The quote is forbidden by the server
  QUOTE_REJECTED_CODE_FORBIDDEN = 10;

  // Server errors
  QUOTE_REJECTED_CODE_INTERNAL_ERROR = 100;
}

// Notifies the resolver that the server has invalidated the quote as requested
// by `InvalidateQuoteRequest`.
//
// The resolver can match `InvalidateQuoteRequest` & `QuoteInvalidatedEvent`
// using `seqno` field.
message QuoteInvalidatedEvent {}

// Notifies the resolver that the order has been updated and is available for
// reservation.
//
// This event is fired in following conditions:
// * The trader has created an order available exclusively to a single resolver.
//   In this case only the exclusive resolver receives the event.
// * The trader has created an order available for public fill (i.e., limit
// order).
// * The exclusivity of the order for specific resolver has ended and the trade
// is available to all resolvers for partial fills.
// * Some resolver has reserved a chunk for partial fill, all resolvers receive
// the event with the same quote and REDUCED
//   `remaining_input_units` compared to previous event.
// * The reservation of some previously allocated chunk has ended, all resolvers
// receive the event with the same quote and INCREASED
//   `remaining_input_units` compared to previous event.
message OrderUpdatedEvent {
  // The quote corresponding to this order.
  Quote quote = 1;

  // The amount of **Input asset** that remains on the position excluding
  // current reservations.
  //
  // This amount might temporarily become zero after reservations and then
  // return to positive value after cancellation of reservations.
  string remaining_input_units = 2;

  // Available number of secrets on the position for chunk reservation.
  //
  // This limits how many additional HTLC executions can still be reserved.
  // This parameter is only valid for HTLC positions. For intrachain this value
  // is always 0.
  uint64 remaining_secrets = 3;

  // Timestamp (UTC seconds) after which the trader can cancel the order without
  // filling the remaining position.
  //
  // After this timestamp passes, the order can be cancelled at any moment.
  // Any exclusivity period for the order also ends on this timestamp.
  uint64 cancellation_available_timestamp = 10;

  // If defined, the position is temporarily available exclusively for the
  // resolver that controls this wallet address on the **Source blockchain**.
  //
  // If omitted, the position is public (not exclusively reserved) and the trade
  // is available to all resolvers for partial fills.
  optional stonfi.common.v1.ChainAddress exclusive_resolver_address = 11;

  // Off-chain **Order details** in protobuf-serialized form.
  //
  // This payload contains exactly the same serialized `VersionedHtlcOrderDetails`
  // that was produced when the order was created, and whose hash is embedded
  // into the corresponding signed order or escrow-backed position.
  //
  // The resolver may recompute the hash of this byte payload and verify that it
  // matches the hash committed on-chain, which proves that the trader signed
  // this exact intent.
  //
  // The payload is transferred in serialized form to avoid differences in
  // binary representation after a deserialize-serialize cycle.
  optional bytes serialized_order_details = 20;

  // Definition of **Trader**'s position.
  oneof position {
    // Defines a position residing on the escrow contract.
    stonfi.common.v1.ChainAddress escrow_address = 21;

    // Defines a **Signed Order** for settling a gasless position that remains
    // on the trader's wallet instead of an escrow contract.
    SignedOrder signed_order = 22;
  }

  // TODO: Dutch auction info or price info.
}

// Notifies the resolver that specified Order is no longer available for
// filling.
//
// The service sends this message when the Order is fully filled or cancelled by
// the trader.
message OrderClosedEvent {
  // The quote corresponding to this position.
  string quote_id = 1;
}

// Notifies the resolver that the state of its Execution for an escrow/HTLC
// chunk has changed.
//
// The service emits this event as the Execution advances through
// on-chain/off-chain phases.
// * The reservation on **Source blockchain** created,
// * Position finality reached,
// * Resolver's position on **Destination blockchain** created,
// * The execution becomes eligible for completion or rollback,
// * The execution is completed or rolled back
message ExecutionUpdatedEvent {
  // The quote corresponding to this position.
  Quote quote = 1;

  // Current status of execution.
  Execution execution = 2;

  // The 256-bit value of the secret used by the HTLC completion flow.
  // If it is empty, the secret has not been revealed yet.
  //
  // This parameter is omitted if the secret has not been published yet and for
  // intrachain swaps.
  optional bytes secret = 10;

  // Off-chain **Order details** in protobuf-serialized form.
  //
  // This payload contains exactly the same serialized `VersionedHtlcOrderDetails`
  // that was produced when the order was created, and whose hash is embedded
  // into the corresponding signed order or escrow-backed position.
  //
  // The resolver may recompute the hash of this byte payload and verify that it
  // matches the hash committed on-chain, which proves that the trader signed
  // this exact intent.
  //
  // The payload is transferred in serialized form to avoid differences in
  // binary representation after a deserialize-serialize cycle.
  optional bytes serialized_order_details = 20;

  // Top-level trader's **Trader**'s position.
  //
  // This value is identical to the one specified in `OrderUpdatedEvent`.
  oneof position {
    // Defines a position residing on the escrow contract.
    stonfi.common.v1.ChainAddress escrow_address = 21;

    // Defines a **Signed Order** for settling a gasless position that remains
    // on the trader's wallet instead of an escrow contract.
    SignedOrder signed_order = 22;
  }
}

// Service sends this event in response to `SignResolverAddressRequest`.
message ResolverAddressSignedEvent {

  // Address of the resolver that has been signed.
  stonfi.common.v1.ChainAddress resolver_address = 1;

  // Address of the protocol contract for which the signature was generated.
  stonfi.common.v1.ChainAddress protocol_contract_address = 2;

  // Public key used by the signature.
  bytes public_key = 3;

  // Signed address of the resolver that will fill the trades.
  bytes signature = 4;

  // The timestamp (UTC seconds) until the signature is valid.
  uint64 validity_deadline = 5;
}

// One event sent by the protocol to a connected resolver.
message ResolverEvent {

  // These fields allow multiplexing over a single gRPC stream by matching
  // the requests and corresponding replies sent as `ResolverRequest` &
  // `ResolverEvent`.
  oneof mux {
    // An identifier of event generated by the server.
    // Uniqueness of seqno is only guaranteed within a single connection.
    // When replying to an event, the resolvers must use corresponding `seqno`
    // in `reply_to` field of the reply.
    uint64 seqno = 1;
    // Contains the `seqno` specified in `ResolverRequest` if the event is a
    // reply to a request. Otherwise this field is empty.
    uint64 reply_to = 2;
  }

  // One of resolver's events.
  oneof event {
    ConnectedEvent connected = 10;
    ResolverAddressSignedEvent resolver_address_signed = 11;

    QuoteRequestedEvent quote_requested = 20;
    QuoteRequestCancelledEvent quote_request_cancelled = 21;
    QuoteAcceptedEvent quote_accepted = 22;
    QuoteRejectedEvent quote_rejected = 23;
    QuoteInvalidatedEvent quote_invalidated = 24;

    OrderUpdatedEvent order_updated = 30;
    OrderClosedEvent order_closed = 31;

    ExecutionUpdatedEvent execution_updated = 40;

    KeepAlive keep_alive = 100;
  }
}
