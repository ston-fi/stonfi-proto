syntax = "proto3";

package stonfi.omni.v1beta8;

import "stonfi/common/types.proto";

////////////////////////////////////////////////////////////////////
// Data structures
////////////////////////////////////////////////////////////////////

// The payload of connection request.
//
// The resolver signs the payload with specified key and sends it to the server
// in the form of `ConnectRequest`.
message AuthenticationPayload {
  // Timestamp of request.
  uint64 connect_timestamp = 1;

  // Address of contract holding resolver's stake that allows to participate in
  // protocol. The stake contract holds resolver's info, including list of
  // authorized keys.
  string stake_address = 2;
}

////////////////////////////////////////////////////////////////////
// Resolver requests
////////////////////////////////////////////////////////////////////

// Signed connection request authenticating the resolver.
message ConnectRequest {

  // ProtoBuf-serialized `AuthenticationPayload`.
  bytes serialized_authentication_payload = 1;

  // Public key used by the signature.
  bytes public_key = 2;

  // Ed25519 signature of payload.
  bytes signature = 3;

  // TODO: Design server-side event filtering/subscription mechanics
}

// Resolver's quote.
message ResolverQuote {

  // Address of the resolver on **Source** blockchain that should receive
  // **Input asset**.
  stonfi.common.ChainAddress resolver_src_address = 1;

  // Amount of **Input asset** that will be received by the resolver.
  //
  // For RFQs specifying `resolver_receives_units` this field should be copied
  // from `QuoteRequestedEvent`. For RFQs specifying `resolver_sends_units` this
  // field should be calculated by the resolver.
  string resolver_receives_units = 2;

  // Address of the resolver on **Destination** blockchain that should send
  // **Output asset** to the trader.
  stonfi.common.ChainAddress resolver_dst_address = 3;

  // Amount of **Output asset** that the resolver will use to fill the trade.
  //
  // For RFQs specifying `resolver_receives_units` this field should be
  // calculated by the resolver. For RFQs specifying `resolver_sends_units` this
  // field should be copied from `QuoteRequestedEvent`.
  string resolver_sends_units = 4;

  // Max timestamp (UTC seconds) of start of the trade.
  //
  // The start of the trade is defined either as the timestamp of the reception
  // of **Input asset** by the protocol smart contract or the timestamp of
  // signing the **Signed Order**.
  //
  // The resolver may still settle the trades started after this deadline has
  // passed at own discretion.
  uint64 trade_start_deadline = 5;
}

// The request to update swap quote by the resolver.
message UpdateQuoteRequest {
  // ID of request as specified by `QuoteRequestedEvent`.
  string rfq_id = 1;

  ResolverQuote quote = 10;
}

message InvalidateQuoteRequest {
  // ID of RFQ from prior `QuoteRequestedEvent` (SHA-256 hex string)
  string rfq_id = 1;
}

message SignResolverAddressRequest {

  // Address of the resolver that will fill the trades.
  stonfi.common.ChainAddress resolver_address = 1;

  // Address of the protocol contract for which the signature should be
  // generated.
  stonfi.common.ChainAddress protocol_contract_address = 2;
}

// Requests from resolver.
message ResolverRequest {
  // These fields allow multiplexing over a single gRPC stream by matching
  // the requests and corresponding replies sent as `ResolverRequest` &
  // `ResolverEvent`.
  oneof mux {
    // The unique ID of the request generated by resolver.
    //
    // This field can be used to match requests and corresponding replies sent
    // as `ResolverEvent`.
    //
    // The server doesn't validate contents of this field and injects it in the
    // `reply_to` field as is. It's recommended to use monotonically increasing
    // atomic integer starting from 1 to avoid difficult to diagnose client-side
    // errors.
    uint64 seqno = 1;
    // Must contain the `seqno` specified in `ResolverEvent` if the event is a
    // reply to a request. Otherwise this field must be empty.
    uint64 reply_to = 2;
  }

  // One of resolver's requests.
  oneof request {
    ConnectRequest connect = 10;
    SignResolverAddressRequest sign_resolver_address = 11;

    UpdateQuoteRequest update_quote = 20;
    InvalidateQuoteRequest invalidate_quote = 21;
  }
}
